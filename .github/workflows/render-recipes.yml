name: Render recipes

on:
  push:
    paths:
      - 'data/**/*.json'
      - 'schema/recipe.schema.json'
      - 'scripts/build.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[skip render]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render JSON recipes to HTML
        run: node scripts/build.mjs
      - name: Commit generated pages
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html recipes/
          git commit -m "Render recipes [skip render]"
          git push
